name: Godot validation and real screenshots

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Import, parse and boot project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Import project resources and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Boot main scene headlessly
        run: godot --headless --path . --quit-after 180

  capture:
    name: Render real gameplay and HUD screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Render game screenshots with Godot
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p artifacts
          xvfb-run -a godot --path . --script tools/capture_screenshot.gd --rendering-method gl_compatibility

      - name: Upload real gameplay screenshots
        uses: actions/upload-artifact@v4
        with:
          name: rust-mobile-survival-real-screenshots
          path: ~/.local/share/godot/app_userdata/**/capture/*.png
          if-no-files-found: error
          retention-days: 14
