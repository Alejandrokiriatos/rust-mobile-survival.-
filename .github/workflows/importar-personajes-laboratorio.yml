name: Importar personajes 3D del laboratorio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/importar-personajes-laboratorio.yml"

permissions:
  contents: write

jobs:
  import-characters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del juego
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Descargar laboratorio 3D
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://codeload.github.com/Alejandrokiriatos/RustMobile3DStudio/zip/refs/heads/main" \
            -o /tmp/lab.zip
          mkdir -p /tmp/lab
          unzip -q /tmp/lab.zip -d /tmp/lab
          SRC="$(find /tmp/lab -maxdepth 1 -type d -name 'RustMobile3DStudio-*' -print -quit)/Models/Characters"
          test -d "$SRC"
          mkdir -p assets/characters/laboratory
          cp "$SRC"/SKIN_*.glb assets/characters/laboratory/
          cp "$SRC"/manifest.json "$SRC"/README.md assets/characters/laboratory/
          test "$(find assets/characters/laboratory -maxdepth 1 -name 'SKIN_*.glb' | wc -l)" -eq 8
          du -sh assets/characters/laboratory
          sha256sum assets/characters/laboratory/SKIN_*.glb > assets/characters/laboratory/SHA256SUMS.txt

      - name: Guardar archivos reales en el repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/laboratory
          git commit -m "Importar ocho personajes 3D desde el laboratorio"
          git push
