name: Preparar recursos y validar Godot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar modelos originales Kenney Nature Kit (CC0)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="1a152705775266732aa24362ad0351c571b201f0"
          git init /tmp/kenney-source
          git -C /tmp/kenney-source remote add origin https://github.com/milnet01/Vestige.git
          git -C /tmp/kenney-source fetch --depth 1 origin "$SOURCE_COMMIT"
          git -C /tmp/kenney-source checkout --detach FETCH_HEAD
          mkdir -p assets/kenney/nature-kit
          for model in tree_default.glb tree_oak.glb rock_largeA.glb rock_smallA.glb plant_bush.glb grass.glb; do
            test -f "/tmp/kenney-source/assets/models/nature/$model"
            cp "/tmp/kenney-source/assets/models/nature/$model" assets/kenney/nature-kit/
          done
          cat > assets/kenney/nature-kit/License.txt <<'EOF'
          Kenney Nature Kit 2.1
          License: CC0 1.0 Universal (public domain dedication).
          Source: https://kenney.nl/assets/nature-kit
          The curated source repository identifies these models as Kenney Nature Kit 2.1, CC0 1.0:
          https://github.com/milnet01/Vestige/blob/main/ASSET_LICENSES.md
          Attribution is not required. Courtesy credit: Kenney.nl.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kenney/nature-kit/*.glb assets/kenney/nature-kit/License.txt
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Add original Kenney Nature Kit CC0 models"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Descargar modelos 3D CC0 de Kenney Survival Kit
        shell: bash
        run: |
          set -euo pipefail
          bash tools/download_survival_models.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kenney/survival-kit assets/terrain
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Add Kenney Survival Kit CC0 3D items"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Descargar Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip             -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Importar recursos y validar scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-import.log; then
            exit 1
          fi

      - name: Ejecutar escena principal en modo headless
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --quit-after 5 2>&1 | tee /tmp/godot-run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-run.log; then
            exit 1
          fi
