name: Preparar recursos y validar Godot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar modelos originales Kenney Nature Kit (CC0)
        shell: bash
        run: |
          set -euo pipefail
          PACK_URL="https://kenney.nl/media/pages/assets/nature-kit/37ac38a37b-1677698939/kenney_nature-kit.zip"
          mkdir -p /tmp/kenney-nature assets/kenney/nature-kit
          curl -L --fail --retry 3 "$PACK_URL" -o /tmp/kenney-nature-kit.zip
          unzip -q /tmp/kenney-nature-kit.zip -d /tmp/kenney-nature
          MODEL_DIR="$(find /tmp/kenney-nature -type d -path '*/Models/GLTF format' -print -quit)"
          test -n "$MODEL_DIR"
          for model in tree_default.glb tree_oak.glb rock_largeA.glb rock_smallA.glb plant_bush.glb plant_bushLarge.glb; do
            test -f "$MODEL_DIR/$model"
            cp "$MODEL_DIR/$model" assets/kenney/nature-kit/
          done
          LICENSE_FILE="$(find /tmp/kenney-nature -iname 'License.txt' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          cp "$LICENSE_FILE" assets/kenney/nature-kit/License.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kenney/nature-kit/*.glb assets/kenney/nature-kit/License.txt
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Add original Kenney Nature Kit CC0 models"
            git push origin HEAD:main
          fi

      - name: Descargar Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip             -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Importar recursos y validar scripts
        run: godot --headless --editor --path . --import --quit

      - name: Ejecutar escena principal en modo headless
        run: godot --headless --path . --quit-after 5
